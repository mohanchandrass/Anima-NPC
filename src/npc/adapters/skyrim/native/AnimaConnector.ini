[Connection]
Port=8768
; F8 DirectInput scan code. Recording requires bridge stt_url.
PushToTalkKey=66
; F7 opens the ANIMA UIExtensions options while NPC dialogue is open.
ConversationMenuKey=65
; F6 DirectInput scan code (64): opens the text box directly while NPC dialogue is open.
; Needs UIExtensions. Outside NPC dialogue it only shows a hint.
ChatKey=64
; Audio-energy mouth movement, not phoneme-aligned lip sync.
AnimateMouth=1
; 1 (default): while an Anima reply plays, the NPC's own vanilla speech is stopped. 0 disables.
SuppressVanillaSpeech=1
; 1 (default): pressing E on an NPC that opens no dialogue menu starts an Anima conversation (text box opens)
; about 700 ms later. If a dialogue menu opens, the vanilla menu session is used instead. 0 disables.
AutoStartOnActivate=1

[Console]
; 1 opens the Anima console window (AnimaConsole.exe) when Skyrim starts and shows all Anima logs.
; Default 0: nothing is launched. A bridge that already answers on Port is left alone.
LaunchConsole=0
; Full path to AnimaConsole.exe (run scripts/install_skyrim_console.py to prepare AnimaConsole.ini next to it).
ConsoleExe=
