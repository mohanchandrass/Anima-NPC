[Connection]
Port=8768
; F8 DirectInput scan code. Recording requires bridge stt_url.
PushToTalkKey=66
; F7 opens the ANIMA UIExtensions options while NPC dialogue is open.
ConversationMenuKey=65
; H DirectInput scan code (35, Mantella's default text key). F6 (64) is a common quick-load key, so it is not the default.
; With a conversation open the key opens the text box (needs UIExtensions). With none open and an NPC under the
; crosshair it starts one and opens the box. The box never opens by itself.
ChatKey=35
; Audio-energy mouth movement, not phoneme-aligned lip sync.
AnimateMouth=1
; 1 (default): while an Anima reply plays, the NPC's own vanilla speech is stopped. 0 disables.
SuppressVanillaSpeech=1
; 1 (default): pressing E on an NPC that opens no dialogue menu starts an Anima conversation about 700 ms later and
; shows a one-time hint; the text box opens only when you press ChatKey. If a dialogue menu opens, the vanilla
; menu session is used instead. 0 disables.
AutoStartOnActivate=1
; 1 (default): each reply is the engine subtitle at the bottom of the screen. Before adding it the plugin kills stale
; subtitle state and resets the engine's current subtitle speaker. 0: message-only mode, no engine entry; the reply
; is shown as an on-screen message "Name: text" (at most three lines of about 70 characters). A missing key means 1.
EngineSubtitle=1
; 0 (default): no on-screen message. 1 also shows the reply as that on-screen message (name prefix, at most three
; lines of about 70 characters) in addition to the engine subtitle. A missing key means 0.
CaptionFallback=0

[Console]
; 1 opens the Anima console window (AnimaConsole.exe) when Skyrim starts and shows all Anima logs.
; Default 0: nothing is launched. A bridge that already answers on Port is left alone.
LaunchConsole=0
; Full path to AnimaConsole.exe (run scripts/install_skyrim_console.py to prepare AnimaConsole.ini next to it).
ConsoleExe=
